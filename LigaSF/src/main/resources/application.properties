spring.application.name=LigaSF

# H2 Database en archivo (RNF-03)
spring.datasource.url=jdbc:h2:file:./data/liga_amateur
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate: no modifica la estructura (la define schema.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Inicialización de SQL (Anexo B)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# JWT
jwt.secret=9a3b6c7d8e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b
jwt.expiration-hours=8
